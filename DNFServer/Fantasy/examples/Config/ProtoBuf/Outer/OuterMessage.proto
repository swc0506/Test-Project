syntax = "proto3";
package Fantasy.Network.Message;

//每一个Request协议后面跟随IRequest,xxx_xxxxResponse、 IResponse、IMessage的意义：

//1.IRequest表示当前协议是一个Reuqest请求，在生成cs文件时该协议会自动继承IRequest接口类。
//IRequest和xxx_xxxxResponse是成对出现的,在生成.cs文件时对有对应的逻辑处理。 详见：ProtoBufExporter 361行

//在生成ProtoBuff.cs文件时，会对ProtoBuff类后注释进行空格拆分，得到这个请求所对应的响应，生成为ResponseType(该请求对应的响应协议), 
//并在加载程序集时把对应的请求和响应进行关系绑定 管理到字典中，这样在收到任意Request消息时就知道该Reqeust对应的是哪一个Resposne
//并通过该Response找到程序集启动时通过反射已经绑定好的RequestHander消息处理类。
//即请求过来后能够直接找该Request的Response协议和需要处理该Request的处理类。这一步是框架通过程序集操作完成的，无需我们手动处理。

//2.IResponse 意义：
// 表示该结构是一个Response协议，并在协议生成时在该使该协议继承IResponse接口，同时也作为生成OpCode(操作码)的标签  详见：ProtoBufExporter 361行

//3.IMessage 表示当前协议是一个主动推送的消息，在生成cs协议时会继承IMessage

//继承IRequest、IResponse、IMessage 的好处是方便框架对这些协议类进行查找和统一管理

//注册账号请求
message RegisterAccountReqest // IRequest,RegisterAccountResponse
{
	string account = 1;//账号
	string passWorld = 2;//密码
}
message RegisterAccountResponse // IResponse
{
	string account = 1;//账号
	string passWorld = 2;//密码
}

//获取登录令牌
message GetTokenReqest // IRequest,GetTokenResponse
{
	string account = 1;//账号
	string passWorld = 2;//密码
}
message GetTokenResponse // IResponse
{
	string token = 1;//登录令牌
	string address = 2;//登录地址
	int64 accountid = 3;//账户id 
}


//获取登录令牌
message LoginGateReqest // IRequest,LoginGateResponse
{
	int64 accountid = 1;//账号
	string token = 2;//密码
}
message LoginGateResponse // IResponse
{
	int64 accountid = 1;//账户id
	int64 level = 2;//等级
	int64 gold = 3;//金币
	int64 diamond = 4;//钻石
	repeated RoleData roleList = 5;//角色列表
}




//创建角色请求
message CreateRoleReqest // IRequest,CreateRoleResponse
{
	int32 roleid = 1;//角色id
	int64 accountid = 2;//账号
	string roleName = 3;//角色名称
}
message CreateRoleResponse // IResponse
{
	RoleData roleData = 1;//角色数据
	
}

message RoleData
{
	int64 uid = 1;//角色唯一id
	string roleName = 2;//角色名称
	int32 level = 3;//角色等级
	int32 roleid = 4;//角色id
	int64 accountid = 5;//所属账号id
}

//选择角色请求
message SelectRoleReqest // IRequest,SelectRoleResponse
{
	int64 roleUid = 1;//角色id
	int64 accountid = 2;//账号
}
message SelectRoleResponse // IResponse
{
	RoleData roleData = 1;//角色数据
}

//进入地图请求
message EnterMapReqest // IRequest,EnterMapResponse
{
	int64 playerid = 1;//玩家id
	int32 curMap = 2;//当前所在的地图
	int32 mapType = 3;//要进入的地图
	int32 doorType = 4;//要去的门
}
//进入地图响应
message EnterMapResponse // IResponse
{
	int64 playerid = 1;//玩家id
	int32 mapType = 2;//要进入的地图
	int32 doorType = 3;//要去的门
	CSVector3 roleInitPos = 4; //角色初始化位置，由服务端计算下发
}


//选择角色请求
message StateSyncReqest // IRequest,StateSyncResponse
{
	int64 statePacketId = 1;//状态数据包id
	StateSyncData roleSyncData = 2;//角色同步数据 
}
message StateSyncResponse // IResponse
{
	int64 statePacketId = 1;//状态数据包id
	StateSyncData roleSyncData = 2;//角色同步数据 
}
//状态同步数据
message StateSyncData
{
	int64 playerid = 1;//玩家账户id
	int32 mapType = 2;//玩家所在地图
	CSVector3 position = 3;//玩家位置
	CSVector3 inputDir = 4;//玩家输入方向
	int32 state = 5;//玩家状态 待机 奔跑 移动
	int32 roleid = 6;//表示玩家角色的配置 模型id
	int32 playerMapStatus = 7;// 1.处于地图中 2.离开地图
}

//其他玩家状态数据通知 
message OtherPlayerStateSyncMessage // IMessage
{
	StateSyncData roleData = 1;
}

 

//客户端服务端公用Vetcor3结构体
message CSVector3
{
	float x = 1;
	float y = 2;
	float z = 3;
}


//创建队伍请求
message CreateTeamReqest // IRequest,CreateTeamResponse
{
	int64 playerid = 1; //状态数据包id
	int32 mapType = 2; //地图类型
}
message CreateTeamResponse // IResponse
{
	int32 tameid = 1;
	RoleData roleData = 2;//角色数据
}

//创建队伍请求
message JoinTeamReqest // IRequest,JoinTeamResponse
{
	int64 playerid = 1; //状态数据包id
	int32 mapType = 2; //地图类型
	int32 teamid = 3; //队伍id
}
message JoinTeamResponse // IResponse
{
	int32 tameid = 1;
	repeated RoleData roleList = 2;//角色列表
}

//队伍状态改变通知
message TeamStateChangeMessage // IMessage
{
	int32 teamState = 1; //1.玩家加入 2.玩家离开 3.队伍解散
	RoleData roleData = 2;//玩家信息
}


//进入地下城通知
message EnterDungeonMessage // IMessage
{
	int32 teamid = 1; // 队伍id
	int32 dungeonCfgid = 2 ; // 地下城配置id
	repeated RoleData teamRoleInfoList = 3;//队伍角色信息列表
}

//加载地下城进度
message LoadDungeonProgresssMessage // IMessage
{
	int32 teamid = 1; // 队伍id
	int64 playerid = 2 ; // 玩家id
	float progress = 3;// 地下城加载进度
}

//开始地下城战斗通知
message StartDungeonBattleMessage // IMessage
{
 	repeated RoleData battleRoleList = 1;
}

//帧操作事件通知 客户端到服务端
message FrameOperateEventMessage_C2G // IMessage
{
	int64 battleid = 1;//战斗id
	repeated FrameOperateData frameDataList = 2;//帧操作事件
}

//帧操作事件广播 服务端到客户端
message FrameOperateEventMessage_G2C // IMessage
{
	int64 battleid = 1;//战斗id
	repeated FrameOperateData frameDataList = 2;//帧操作事件
	int64 logicFrameid = 3;//逻辑帧id
}

//操作帧数据 这个结构体要保证传输越小越好，因为数据量越小传输速度越快
message FrameOperateData
{
	int32 operateType = 1;//操作类型 0：无操作 1：方向输入 2：释放技能
	CSFixIntVector3 inputDir = 2; //输入方向
	int32 skillid = 3;//技能id
	int32 skillType = 4;// 技能类型 1.点击触发普通技能 2.引导技能 3.蓄力技能
	CSFixIntVector3 skillPos = 5; //引导技能位置
	int64 playerid = 6;//玩家id
}
//双端公用定点数Vector3
message CSFixIntVector3
{
	int32 x = 1;
	int32 y = 2;
	int32 z = 3;
}

//帧操作事件广播 服务端到客户端
message BattleEndRewardMessage_Share // IMessage
{
   int32 cardRewardIndex = 1;//卡牌物品索引
   int64 battleid = 2;//战斗id
   int64 playerid = 3;//玩家id
}

//战斗结束消息
message BattleEndMessage_Share // IMessage
{
   int64 battleid = 1;//战斗id
   int64 playerid = 2;//玩家id
}

//创建队伍请求
message ExitDungeonReqest // IRequest,JoinTeamResponse
{
	int64 battleid = 1; //状态数据包id
	int64 playerid = 2; //玩家id
}
message ExitDungeonResponse // IResponse
{
	int64 battleid = 1; //状态数据包id
	int64 playerid = 2; //玩家id
}


message C2A_TestRequest // IRequest,A2C_TestResponse
{

}
message A2C_TestResponse // IResponse
{

}

message TestLoginRequest // IRequest,TestLoginResponse
{
	string account = 1; //格式要标准 ， 因为ProtoBuffExporter.Members函数中会按照空格进行拆分，没有空格会导致拆分报错，协议无法生成
	string pass = 2;
}

message TestLoginResponse // IResponse
{
	
}

message C2G_TestMessageEvent // IMessage
{
	string message = 1;
	int frameOpCode = 2;
}

message G2C_TestSeverToClientMessage // IMessage
{
	string message = 1;
	int frameOpCode = 2;
}